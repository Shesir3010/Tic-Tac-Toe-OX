name: .NET

on:
  push:
    branches: [ "main", "Tic-Tac-Toe-V1" ]
  pull_request:
    branches: [ "main", "Tic-Tac-Toe-V1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.403
    - name: Restore dependencies
      run: dotnet restore TicTacToe.slnx
    # NU1902/NU1903: System.Security.Cryptography.* 10.0.10 (latest patch) still
    # carries upstream GHSA advisories with no fixed version published yet.
    # Compiler warnings (CS*) stay errors; audit is a separate gate below.
    - name: Build
      run: dotnet build TicTacToe.slnx --no-restore --configuration Release -p:TreatWarningsAsErrors=true "-p:NoWarn=NU1902%3BNU1903"
    - name: Test
      run: dotnet test TicTacToe.slnx --no-build --configuration Release --verbosity normal
    - name: Audit vulnerable packages
      run: dotnet list TicTacToe.slnx package --vulnerable --include-transitive
